[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "18"

# Custom domain configuration
[context.production]
  [context.production.environment]
    SITE_URL = "https://test.versobid.com"